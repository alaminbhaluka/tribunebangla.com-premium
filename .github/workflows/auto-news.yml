name: Tribune Bangla Auto News

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auto-news.mjs'
      - '.github/workflows/auto-news.yml'
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tribune-auto-news
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch source news
        run: node scripts/auto-news.mjs
      - name: Commit new source-attributed summaries
        run: |
          git config --local user.email "bot@tribunebangla.com"
          git config --local user.name "Tribune Bangla News Bot"
          git add articles.json
          git diff --cached --quiet || (git commit -m "Auto-publish up to 12 source-attributed news summaries" && git push)
