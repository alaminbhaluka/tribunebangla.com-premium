name: Foundation checks
on:
  push:
    branches:
      - "development/**"
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run check
      - run: npm test
      - run: deno check supabase/functions/ingest-news/index.ts
